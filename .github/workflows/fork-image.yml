name: Fork Image (GHCR)

# Fork-only workflow: builds THIS fork's code (release/v*) and pushes it to
# THIS fork's own GHCR package (ghcr.io/<owner>/omniroute). The upstream
# docker-publish.yml hardcodes the upstream registries (diegosouzapw/*) and
# can never authenticate from a fork — that is why its fork runs fail.

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/omniroute

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:next
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=fork-image
          cache-to: type=gha,scope=fork-image,mode=max
